<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racketsamrhein · Venue Command Center</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#f7f8fa;color:#101828}.boot{display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:white;border:1px solid #e4e7ec;border-radius:18px;padding:28px 32px;box-shadow:0 8px 30px rgba(16,24,40,.08);max-width:520px}.logo{font-weight:800;font-size:22px}.sub{margin-top:8px;color:#667085}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div class="boot"><div class="card"><div class="logo">Racketsamrhein</div><div class="sub" id="status">Venue Command Center wird geladen…</div></div></div><script>(async()=>{try{if(!window.pako)throw new Error('Dekomprimierung konnte nicht geladen werden');const urls=['chunks/c1.txt','chunks/c2.txt','chunks/c3.txt'];const parts=[];for(const u of urls){const r=await fetch(u+'?v=7',{cache:'no-store'});if(!r.ok)throw new Error('Datenblock fehlt: '+u);parts.push(await r.text())}const b=parts.join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const html=pako.ungzip(bin,{to:'string'});if(!html.includes('Venue Command Center'))throw new Error('Ungültige Kartendatei');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<b>Die Karte konnte nicht geladen werden.</b><br><br>'+e.message;console.error(e)}})();</script></body></html>
