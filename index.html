<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rackets am Rhein · Venue Command Center</title></head><body><div id="boot" style="font:600 15px system-ui;padding:28px">Rackets am Rhein · Command Center wird geladen…</div><script>(async()=>{try{const p=await Promise.all(['chunks/c1.txt','chunks/c2.txt','chunks/c3.txt'].map(x=>fetch(x+'?v=4').then(r=>{if(!r.ok)throw Error(x);return r.text()})));const b=p.join('').trim();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('boot').innerHTML='<b>Command Center konnte nicht geladen werden.</b><br>Bitte Seite einmal neu laden.';console.error(e)}})();</script></body></html>
