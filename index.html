<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rackets am Rhein Venue Command Center</title></head><body><div id="status" style="font:16px system-ui;padding:24px">Rackets am Rhein wird geladen…</div><script>(async()=>{try{const parts=await Promise.all(['chunks/c1.txt','chunks/c2.txt','chunks/c3.txt'].map(u=>fetch(u+'?v=5',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));const b=parts.join('').trim();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Browser unterstützt DecompressionStream nicht');const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div style="font:16px system-ui;padding:24px"><b>Die Karte konnte nicht geladen werden.</b><br><br>'+String(e)+'</div>';console.error(e)}})();</script></body></html>
